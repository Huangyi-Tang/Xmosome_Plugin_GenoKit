<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Clean Apple-style sliders representing QC threshold filters (mind, geno, maf) -->
  <rect width="64" height="64" rx="14" fill="#0A6EE8" fill-opacity="0.12"/>
  <!-- Track 1 -->
  <line x1="14" y1="20" x2="50" y2="20" stroke="#0A6EE8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="25" cy="20" r="5" fill="#0A6EE8"/>
  <!-- Track 2 -->
  <line x1="14" y1="32" x2="50" y2="32" stroke="#0A6EE8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="39" cy="32" r="5" fill="#0A6EE8"/>
  <!-- Track 3 -->
  <line x1="14" y1="44" x2="50" y2="44" stroke="#0A6EE8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="21" cy="44" r="5" fill="#0A6EE8"/>
</svg>
